name: Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # lets the model id bot run this required check on its PR branch

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: astral-sh/setup-uv@v10.3.2
    - run: ./scripts/validate
    - name: Require plugin and marketplace version bumps
      if: github.event_name == 'pull_request'
      run: uv run python scripts/check_version_bump.py --base "origin/${{ github.base_ref }}"
