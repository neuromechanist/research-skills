name: Model IDs

# Daily at 12:00 America/Los_Angeles: compare scripts/model_registry.json with the
# Anthropic and OpenAI model lists and open (or refresh) one PR that moves every
# family to its newest id, with plugin and marketplace patch bumps.
#
# Setup (see "Model ids" in AGENTS.md):
#   Anthropic and OpenAI: Workload Identity Federation through the shared
#   neuromechanist/.github/actions/{claude,openai}-auth actions (no stored keys, nothing to
#   configure per repository). A provider without a credential is skipped and the job
#   fails at the end;
#   either "Allow GitHub Actions to create and approve pull requests" in the
#   repository's Actions settings, or a MODEL_BOT_TOKEN secret (fine-grained token with
#   contents and pull-requests write). PRs opened with GITHUB_TOKEN do not trigger the
#   Validation workflow, so this job runs ./scripts/validate itself before pushing.
on:
  schedule:
    - cron: '0 19 * * *'  # 12:00 PDT
    - cron: '0 20 * * *'  # 12:00 PST
  workflow_dispatch:

permissions:
  actions: write  # dispatch Validation and Typos on the bot branch
  contents: write
  pull-requests: write
  id-token: write  # GitHub OIDC token for Anthropic Workload Identity Federation

concurrency:
  group: model-ids
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BRANCH: bot/model-ids
    steps:
    - name: Run once per day at noon Pacific
      id: gate
      env:
        EVENT: ${{ github.event_name }}
        SCHEDULE: ${{ github.event.schedule }}
      run: |
        # Each cron matches noon in one half of the year; keep the one whose UTC offset is current,
        # judged by the trigger rather than the clock, so a delayed start still runs.
        offset=$(TZ=America/Los_Angeles date +%z)
        case "$EVENT/$SCHEDULE/$offset" in
          workflow_dispatch/*|schedule/"0 19 * * *"/-0700|schedule/"0 20 * * *"/-0800) echo "run=true" >> "$GITHUB_OUTPUT" ;;
          *) echo "run=false" >> "$GITHUB_OUTPUT"; echo "Not noon Pacific for this trigger (offset $offset); skipping." ;;
        esac

    - uses: actions/checkout@v4
      if: steps.gate.outputs.run == 'true'
      with:
        token: ${{ secrets.MODEL_BOT_TOKEN || github.token }}
        fetch-depth: 0  # the version-bump check compares with origin/main

    - uses: astral-sh/setup-uv@v5
      if: steps.gate.outputs.run == 'true'

    - name: Authenticate to Anthropic (Workload Identity Federation)
      if: steps.gate.outputs.run == 'true'
      uses: neuromechanist/.github/actions/claude-auth@v1

    - name: Authenticate to OpenAI (Workload Identity Federation)
      if: steps.gate.outputs.run == 'true'
      uses: neuromechanist/.github/actions/openai-auth@v1

    - name: Compare model lists and apply updates
      id: check
      if: steps.gate.outputs.run == 'true'
      run: |
        uv run python scripts/update_model_ids.py --apply --summary "$RUNNER_TEMP/summary.md"
        cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"

    - name: Validate the updated tree
      if: steps.check.outputs.changed == 'true'
      run: ./scripts/validate

    - name: Require plugin and marketplace version bumps
      if: steps.check.outputs.changed == 'true'
      run: uv run python scripts/check_version_bump.py --base origin/main

    - name: Open or refresh the update PR
      if: steps.check.outputs.changed == 'true'
      env:
        GH_TOKEN: ${{ secrets.MODEL_BOT_TOKEN || github.token }}
        HAS_BOT_TOKEN: ${{ secrets.MODEL_BOT_TOKEN != '' }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git switch -c "$BRANCH"
        git add -A
        git commit -q -m "Update model ids to the newest provider releases"
        # Leave an open PR alone when it already carries this exact tree, so reviews and checks survive.
        if git fetch -q origin "$BRANCH" 2>/dev/null && git diff --quiet FETCH_HEAD HEAD; then
          echo "origin/$BRANCH already has this update; nothing to push."
        else
          git push --force -q origin "$BRANCH"
        fi
        title="Update model ids to the newest provider releases"
        if [ "$(gh pr view "$BRANCH" --json state --jq .state 2>/dev/null)" = "OPEN" ]; then
          gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/summary.md"
        elif ! gh pr create --base main --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/summary.md"; then
          echo "::error::Pushed $BRANCH but could not open a PR. Enable 'Allow GitHub Actions to create and approve pull requests' or add a MODEL_BOT_TOKEN secret, then open the PR from $BRANCH."
          exit 1
        fi
        # Events from GITHUB_TOKEN start no workflows, except workflow_dispatch: run the
        # required checks on the branch so their results attach to the PR's head commit.
        if [ "$HAS_BOT_TOKEN" != "true" ]; then
          gh workflow run tests.yml --ref "$BRANCH"
          gh workflow run typos.yml --ref "$BRANCH"
        fi
        # Merge on its own once the required checks (validate, typos) pass.
        gh pr merge "$BRANCH" --auto --merge

    - name: Fail when the check was incomplete
      if: steps.check.outputs.incomplete == 'true'
      run: |
        echo "::error::A provider was skipped (missing secret) or a family matched no listed model; see the job summary."
        exit 1
