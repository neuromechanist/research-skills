<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="89mm" height="40mm" viewBox="0 0 89 40">

  <!--
    Example schematic: a three-stage signal processing chain.
    Demonstrates: viewBox-equals-mm sizing, okabe-ito palette compliance,
    centered-in-box text, straight + dashed arrows, z-order (connections
    drawn before nodes), near-gray exemption for chrome.
  -->

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="3" markerHeight="3" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="44.5" y="5" text-anchor="middle" dominant-baseline="hanging"
        font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="6">
    EEG processing chain
  </text>

  <!-- connections (drawn first so nodes sit on top) -->
  <line x1="22" y1="22" x2="33" y2="22"
        stroke="#000000" stroke-width="0.8" marker-end="url(#arrow)"/>
  <line x1="55" y1="22" x2="66" y2="22"
        stroke="#000000" stroke-width="0.8" marker-end="url(#arrow)"/>

  <!-- nodes -->
  <rect id="node-acq" x="2" y="16" width="20" height="12"
        fill="#ffffff" stroke="#0072B2" stroke-width="0.8" rx="1.5"/>
  <text x="12" y="22" text-anchor="middle" dominant-baseline="middle"
        font-family="Helvetica, Arial, sans-serif" font-size="5">Acquire</text>

  <rect id="node-filter" x="33" y="16" width="22" height="12"
        fill="#56B4E9" stroke="#0072B2" stroke-width="0.8" rx="1.5"/>
  <text x="44" y="22" text-anchor="middle" dominant-baseline="middle"
        font-family="Helvetica, Arial, sans-serif" font-size="5">Bandpass</text>

  <rect id="node-classify" x="66" y="16" width="20" height="12"
        fill="#009E73" stroke="#0072B2" stroke-width="0.8" rx="1.5"/>
  <text x="76" y="22" text-anchor="middle" dominant-baseline="middle"
        font-family="Helvetica, Arial, sans-serif" font-size="5">Classify</text>

  <!-- artifact-gate annotation (dashed line under nodes; #888 is near-gray, exempt) -->
  <line x1="44" y1="32" x2="44" y2="29"
        stroke="#888888" stroke-width="0.6" stroke-dasharray="1 0.6"/>
  <text x="44" y="36" text-anchor="middle" dominant-baseline="middle"
        font-family="Helvetica, Arial, sans-serif" font-size="5"
        fill="#D55E00">
    artifact gate
  </text>

</svg>
